<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nyan Cat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
#cat-wrap {
  position: absolute;
  /* transition applied dynamically — no static rule here */
}
#nyan {
  display: block;
  width: 384px;
  height: 216px;
  image-rendering: pixelated;
}
#hint {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.7);
  font: 13px/1 monospace;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  pointer-events: none; user-select: none;
  transition: opacity 3s;
}
</style>
</head>
<body>
<div id="cat-wrap">
  <img id="nyan" src="nyan_transparent.gif" alt="Nyan Cat">
</div>
<div id="hint">press any key or click to jump</div>
<script>
'use strict';

// ---- Constants ----
const BASE_SPEED = 0.4;   // px/frame idle  (~24 px/s @ 60 fps)
const MAX_SPEED  = 2.5;   // px/frame at peak typing (~150 px/s)
const DIR_BLEND  = 0.015; // direction interpolation per frame (smooth turns)
const PAD        = 10;    // px from screen edge

// ---- State ----
const wrap = document.getElementById('cat-wrap');
const img  = document.getElementById('nyan');

let catX = 0, catY = 0;
let driftVX = 1, driftVY = 0;
let targetVX = 1, targetVY = 0;
let speedMult = 1.0;
let moving = false;

function catSize() {
  return { w: img.offsetWidth, h: img.offsetHeight };
}

// ---- Position helper ----
function setPos(withTransition, duration) {
  wrap.style.transition = withTransition
    ? `left ${duration}s cubic-bezier(.25,.46,.45,.94),
       top  ${duration}s cubic-bezier(.25,.46,.45,.94)`
    : 'none';
  wrap.style.left = catX + 'px';
  wrap.style.top  = catY + 'px';
}

// ---- Init ----
function initPos() {
  const { w, h } = catSize();
  catX = Math.round((window.innerWidth  - w) / 2);
  catY = Math.round((window.innerHeight - h) / 2);
  const angle = Math.random() * Math.PI * 2;
  driftVX = targetVX = Math.cos(angle);
  driftVY = targetVY = Math.sin(angle);
  setPos(false);
}

// ---- Drift loop ----
function driftStep() {
  if (!moving) {
    const speed = BASE_SPEED + ((speedMult - 1) / 2) * (MAX_SPEED - BASE_SPEED);

    // Smoothly blend direction toward target
    driftVX += (targetVX - driftVX) * DIR_BLEND;
    driftVY += (targetVY - driftVY) * DIR_BLEND;

    catX += driftVX * speed;
    catY += driftVY * speed;

    // Bounce off edges — mirror both actual and target velocity component
    const { w, h } = catSize();
    if (catX < PAD)                             { catX = PAD;                             driftVX =  Math.abs(driftVX); targetVX =  Math.abs(targetVX); }
    if (catX > window.innerWidth  - w - PAD)    { catX = window.innerWidth  - w - PAD;    driftVX = -Math.abs(driftVX); targetVX = -Math.abs(targetVX); }
    if (catY < PAD)                             { catY = PAD;                             driftVY =  Math.abs(driftVY); targetVY =  Math.abs(targetVY); }
    if (catY > window.innerHeight - h - PAD)    { catY = window.innerHeight - h - PAD;    driftVY = -Math.abs(driftVY); targetVY = -Math.abs(targetVY); }

    setPos(false);
  }
  requestAnimationFrame(driftStep);
}

// ---- Periodic direction changes ----
function scheduleDirChange() {
  setTimeout(() => {
    const angle = Math.random() * Math.PI * 2;
    targetVX = Math.cos(angle);
    targetVY = Math.sin(angle);
    scheduleDirChange();
  }, 5000 + Math.random() * 5000);
}

// ---- User-triggered jump ----
function moveToRandom() {
  const { w, h } = catSize();
  catX = PAD + Math.random() * (window.innerWidth  - w - 2 * PAD);
  catY = PAD + Math.random() * (window.innerHeight - h - 2 * PAD);
  const duration = Math.max(0.2, 0.55 / speedMult);
  setPos(true, duration);
}

// ---- IPC from main process ----
wrap.addEventListener('transitionend', () => {
  moving = false;
  window.nyan.moveDone();
  // drift resumes automatically on next RAF frame since moving is false
});

window.nyan.onMove(() => {
  if (moving) return;
  moving = true;
  moveToRandom();
});

window.nyan.onSpeedUpdate((mult) => {
  speedMult = mult;
});

// ---- Resize ----
window.addEventListener('resize', initPos);

// ---- Hint fade ----
setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 5000);

// ---- Start ----
function start() {
  initPos();
  scheduleDirChange();
  requestAnimationFrame(driftStep);
}

img.addEventListener('load', start);
if (img.complete) start();
</script>
</body>
</html>
